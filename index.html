<style>
/* Liquid glass: translucent blurred panels with a specular top edge over soft colour fields. */
:root{
  --bg:#E6EDF4; --ink:#10201C; --muted:#4F625C;

  --blob1:rgba(20,140,120,.45); --blob2:rgba(70,80,200,.38); --blob3:rgba(190,100,60,.28); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1014; --ink:#E8F1ED; --muted:#9BAEA6;
  --glass:rgba(34,46,56,.46); --glass-strong:rgba(46,60,72,.7); --glass-edge:rgba(255,255,255,.2);
  --surface2:rgba(150,165,180,.16); --line:rgba(160,175,190,.2); --field:rgba(255,255,255,.07); --shadow:0 10px 34px rgba(0,0,0,.45);

  background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:16px 108px;font-variant-numeric:tabular-nums}

  box-shadow:inset 0 1px 0 var(--glass-edge),inset 0 0 0 1px var(--line),var(--shadow)}

input,select,textarea{font:inherit;color:var(--ink);background:var(--field);border:0;box-shadow:inset 0 0 0 1px var(--line),inset 0 1px 2px rgba(0,0,0,.05);border-radius:14px;padding:8px 12px;min-height:40px;width:100%;box-sizing:border-box;min-width:0}

.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-radius:20px;padding:10px 16px;font-size:14px}

.cal .h{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:4px 0}
.cal button{font:inherit;background:var(--field);border:0;box-shadow:inset 0 0 0 1px transparent;border-radius:16px;min-height:52px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--ink)}
.cal button.today{box-shadow:inset 0 0 0 1.5px var(--accent)}

  box-shadow:inset 0 1px 0 var(--glass-edge),inset 0 0 0 1px var(--line),0 24px 70px rgba(10,20,30,.35)}
.chips{display:flex;flex-wrap:wrap;gap:8px}

<div class="wrap" id="app"></div>

<script>
(() => {
'use strict';

/* ---------- storage (swap this adapter for Firebase/etc. when sync is needed) ---------- */
const Store = {
  key: 'pocket-ledger-v1',
  load() { try { const r = localStorage.getItem(this.key); if (r) return JSON.parse(r); } catch (e) {} return null; },
  save(s) { try { localStorage.setItem(this.key, JSON.stringify(s)); } catch (e) {} }
};

/* ---------- helpers ---------- */
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = iso(new Date());
const thisMonth = today.slice(0, 7);
const addMonth = (k, n) => { const [y, m] = k.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const monthLabel = k => { const [y, m] = k.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' }); };
const shortMonth = k => { const [y, m] = k.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString(undefined, { month: 'short' }); };
const dayLabel = s => parse(s).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
const lastDay = k => { const [y, m] = k.split('-').map(Number); return `${k}-${pad(new Date(y, m, 0).getDate())}`; };
const round2 = n => Math.round(n * 100) / 100;

const PRESETS = ['Groceries', 'Rent', 'Transport', 'Eating out', 'Fun', 'Bills', 'Shopping', 'Health', 'Subscriptions', 'Travel', 'Education', 'Gifts', 'Savings', 'Other'];
const PAL = ['#0E7C66', '#E07A3F', '#5B7FD6', '#C9A227', '#B455A0', '#3AA6B9', '#7A8B3C', '#D1495B', '#7C6F64'];

/* ---------- recurring occurrences ---------- */
function occ(r, fromIso, toIso) {
  const out = [], s = parse(r.start), from = parse(fromIso), to = parse(toIso), end = r.end ? parse(r.end) : null;
  if (r.freq === 'weekly' || r.freq === 'biweekly') {
    const step = r.freq === 'weekly' ? 7 : 14;
    const d = new Date(s);
    if (d < from) { const days = Math.round((from - d) / 86400000); d.setDate(d.getDate() + Math.ceil(days / step) * step); }
    for (; d <= to; d.setDate(d.getDate() + step)) { if (end && d > end) break; out.push(iso(d)); }
  } else {
    const per = r.freq === 'yearly' ? 12 : 1, sd = s.getDate();
    for (let i = 0; i < 700; i++) {
      const y = s.getFullYear(), m = s.getMonth() + i * per;
      const dim = new Date(y, m + 1, 0).getDate();
      const d = new Date(y, m, Math.min(sd, dim));
      if (d > to) break;
      if (d >= from && (!end || d <= end)) out.push(iso(d));
    }
  }
  return out;
}

/* ---------- seed (sample data, clearly flagged) ---------- */
function seed() {
  const now = new Date(), y = now.getFullYear(), m = now.getMonth();
  const first = iso(new Date(y, m - 5, 1)).slice(0, 8);
  const rec = (name, amount, type, cat, freq, start, auto) => ({ id: uid(), name, amount, type, cat, freq, start, auto: !!auto, autoThrough: auto ? today : undefined });
  const s = {
    v: 1, sample: true, currency: 'EUR',
    people: [{ id: 'p_me', name: 'Me' }, { id: 'p_a', name: 'Tomas' }, { id: 'p_b', name: 'Nina' }],
    cats: ['Groceries', 'Rent', 'Transport', 'Eating out', 'Fun', 'Bills', 'Shopping', 'Health', 'Other'],
    incCats: ['Salary', 'Side income', 'Other income'],
    budgets: { Groceries: 350, 'Eating out': 120, Fun: 100, Transport: 60, Shopping: 100 },
    txns: [], goals: [], splits: [],
    recurring: [
      rec('Salary', 2400, 'income', 'Salary', 'monthly', first + '01', true),
      rec('Rent', 800, 'expense', 'Rent', 'monthly', first + '03', true),
      rec('Streaming', 9.99, 'expense', 'Fun', 'monthly', first + '12', true),
      rec('Phone plan', 25, 'expense', 'Bills', 'monthly', first + '15', true),
      Object.assign(rec('Hourly shifts', 600, 'income', 'Side income', 'monthly', first + '27'), { amountMax: 900 }),
      rec('Gym', 29, 'expense', 'Health', 'monthly', first + '20'),
      rec('Travel insurance', 120, 'expense', 'Bills', 'yearly', iso(new Date(y - 1, m + 2, 25)))
    ]
  };
  s.recurring.forEach(r => occ(r, first + '01', today).forEach(d =>
    s.txns.push({ id: uid(), type: r.type, amount: r.amountMax ? (r.amount + r.amountMax) / 2 : r.amount, cat: r.cat, date: d, note: r.name, recId: r.id })));
  let sv = 7; const rnd = () => (sv = (sv * 16807) % 2147483647) / 2147483647;
  const plan = [
    ['Groceries', 5, 12, 60, ['Albert', 'Billa', 'Lidl', 'Market']],
    ['Eating out', 4, 8, 35, ['Lunch', 'Coffee', 'Dinner']],
    ['Transport', 3, 5, 25, ['Tram pass', 'Taxi', 'Train']],
    ['Fun', 2, 10, 40, ['Cinema', 'Concert']],
    ['Shopping', 1, 20, 80, ['Clothes', 'Books']]
  ];
  for (let k = 0; k < 6; k++) {
    const mk = addMonth(thisMonth, -k);
    plan.forEach(([cat, n, lo, hi, notes]) => {
      for (let i = 0; i < n; i++) {
        const date = `${mk}-${pad(1 + Math.floor(rnd() * 27))}`;
        if (date > today) continue;
        s.txns.push({ id: uid(), type: 'expense', amount: round2(lo + rnd() * (hi - lo)), cat, date, note: notes[Math.floor(rnd() * notes.length)] });
      }
    });
  }
  s.goals = [
    { id: uid(), name: 'New laptop', target: 1500, saved: 620, deadline: iso(new Date(y, m + 4, 1)) },
    { id: uid(), name: 'Summer trip', target: 900, saved: 210, deadline: iso(new Date(y, m + 8, 1)) }
  ];
  const d = n => iso(new Date(y, m, Math.max(1, new Date().getDate() - n)));
  s.splits = [
    { id: uid(), kind: 'exp', desc: 'Dinner out', amount: 63, date: d(9), payer: 'p_me', with: ['p_me', 'p_a', 'p_b'] },
    { id: uid(), kind: 'exp', desc: 'Weekend groceries', amount: 48, date: d(6), payer: 'p_a', with: ['p_me', 'p_a', 'p_b'] },
    { id: uid(), kind: 'exp', desc: 'Cabin booking', amount: 240, date: d(3), payer: 'p_b', with: ['p_me', 'p_a', 'p_b'] },
    { id: uid(), kind: 'pay', from: 'p_a', to: 'p_me', amount: 10, date: d(1) }
  ];
  return s;
}

function blank() {
  return { v: 1, sample: false, currency: 'EUR', people: [{ id: 'p_me', name: 'Me' }],
    cats: [],
    incCats: ['Salary', 'Side income', 'Other income'], budgets: {}, txns: [], recurring: [], goals: [], splits: [] };
}

/* ---------- state ---------- */
let S = Store.load() || seed();
/* Automatic recurring payments: log every occurrence that has come due since the last check. */
function autoPost() {
  let changed = false;
  S.recurring.forEach(r => {
    if (!r.auto) return;
    const from = r.autoThrough ? iso(new Date(parse(r.autoThrough).getTime() + 86400000 + 3600000)) : r.start;
    if (from <= today) occ(r, from, today).forEach(d => {
      if (!isPaid(r.id, d)) S.txns.push({ id: uid(), type: r.type, amount: r.amount, cat: r.cat, date: d, note: r.name, recId: r.id });
    });
    if (r.autoThrough !== today) { r.autoThrough = today; changed = true; }
  });
  return changed;
}
const ui = { tab: 'overview', month: thisMonth, cal: thisMonth, day: today, settings: false, recModal: false, catModal: false, confirmReset: false, msg: '' };
const app = document.getElementById('app');
const commit = () => { autoPost(); Store.save(S); render(); };

const fmt = (n, dec = 2) => new Intl.NumberFormat(undefined, { style: 'currency', currency: S.currency || 'EUR', minimumFractionDigits: dec, maximumFractionDigits: dec }).format(n);
const fmt0 = n => fmt(n, 0);
const catColor = c => { const i = S.cats.indexOf(c); return (S.catColors && S.catColors[c]) || (i < 0 ? '#7C6F64' : PAL[i % PAL.length]); };
function ensureColors() { S.catColors = S.catColors || {}; S.cats.forEach((c, i) => { if (!S.catColors[c]) S.catColors[c] = PAL[i % PAL.length]; }); }
const pn = id => (S.people.find(p => p.id === id) || { name: '?' }).name;
const isPaid = (rid, date) => S.txns.some(t => t.recId === rid && t.date === date);

const rmax = r => r.amountMax > r.amount ? r.amountMax : r.amount;
const isRange = r => rmax(r) > r.amount;
const rfmt = r => isRange(r) ? `${fmt(r.amount)} to ${fmt(rmax(r))}` : fmt(r.amount);
const payInput = r => isRange(r) ? `<input type="number" step="0.01" min="0.01" inputmode="decimal" style="width:90px" aria-label="Actual amount" value="${round2((r.amount + rmax(r)) / 2)}">` : '';
const monthTx = k => S.txns.filter(t => t.date.startsWith(k));
const totals = k => { let inc = 0, exp = 0; monthTx(k).forEach(t => t.type === 'income' ? inc += t.amount : exp += t.amount); return { inc, exp }; };
const byCat = k => { const m = {}; monthTx(k).forEach(t => { if (t.type === 'expense') m[t.cat] = (m[t.cat] || 0) + t.amount; }); return m; };
const catOpts = () => `<optgroup label="Spending">${S.cats.map(c => `<option value="e:${esc(c)}">${esc(c)}</option>`).join('')}</optgroup><optgroup label="Income">${S.incCats.map(c => `<option value="i:${esc(c)}">${esc(c)}</option>`).join('')}</optgroup>`;

function balances() {
  const b = {}; S.people.forEach(p => b[p.id] = 0);
  S.splits.forEach(x => {
    if (x.kind === 'exp') {
      const w = x.with.filter(id => id in b); if (!w.length || !(x.payer in b)) return;
      b[x.payer] += x.amount; w.forEach(id => b[id] -= x.amount / w.length);
    } else if (x.from in b && x.to in b) { b[x.from] += x.amount; b[x.to] -= x.amount; }
  });
  return b;
}
function settleSteps() {
  const b = balances(), cr = [], de = [];
  for (const id in b) { const v = round2(b[id]); if (v > 0.005) cr.push([id, v]); else if (v < -0.005) de.push([id, -v]); }
  cr.sort((a, c) => c[1] - a[1]); de.sort((a, c) => c[1] - a[1]);
  const out = []; let i = 0, j = 0;
  while (i < de.length && j < cr.length) {
    const amt = Math.min(de[i][1], cr[j][1]);
    out.push({ from: de[i][0], to: cr[j][0], amount: round2(amt) });
    de[i][1] -= amt; cr[j][1] -= amt;
    if (de[i][1] < 0.005) i++; if (cr[j][1] < 0.005) j++;
  }
  return out;
}

/* ---------- charts ---------- */
function donut(entries, total) {
  const r = 46, c = 2 * Math.PI * r; let off = 0;
  const segs = entries.map(([name, v]) => {
    const len = (v / total) * c;
    const s = `<circle cx="60" cy="60" r="${r}" fill="none" stroke="${catColor(name)}" stroke-width="16" stroke-dasharray="${len} ${c - len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;
    off += len; return s;
  }).join('');
  return `<svg viewBox="0 0 120 120" width="150" height="150" role="img" aria-label="Spending by category">
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="16"/>${total ? segs : ''}
    <text x="60" y="58" text-anchor="middle" class="t" style="font-size:9px">Spent</text>
    <text x="60" y="73" text-anchor="middle" style="font-size:13px;font-weight:700;fill:var(--ink)">${esc(fmt0(total))}</text></svg>`;
}
function bars() {
  const keys = []; for (let i = 5; i >= 0; i--) keys.push(addMonth(ui.month, -i));
  const data = keys.map(totals), max = Math.max(1, ...data.flatMap(d => [d.inc, d.exp]));
  const W = 360, H = 170, pl = 38, pb = 22, pt = 10, pr = 4, ih = H - pb - pt, gw = (W - pl - pr) / 6, bw = Math.min(16, gw / 2 - 4);
  const y = v => pt + ih - (v / max) * ih, cf = new Intl.NumberFormat(undefined, { notation: 'compact', maximumFractionDigits: 1 });
  let g = '';
  [0, .5, 1].forEach(f => { g += `<line class="g" x1="${pl}" x2="${W - pr}" y1="${y(max * f)}" y2="${y(max * f)}"/><text class="t" x="${pl - 4}" y="${y(max * f) + 3}" text-anchor="end">${cf.format(max * f)}</text>`; });
  data.forEach((d, i) => {
    const x0 = pl + i * gw + gw / 2;
    g += `<rect class="c-inc" x="${x0 - bw - 1}" y="${y(d.inc)}" width="${bw}" height="${ih - (y(d.inc) - pt)}" rx="2"/>`;
    g += `<rect class="c-exp" x="${x0 + 1}" y="${y(d.exp)}" width="${bw}" height="${ih - (y(d.exp) - pt)}" rx="2"/>`;
    g += `<text class="t" x="${x0}" y="${H - 6}" text-anchor="middle">${esc(shortMonth(keys[i]))}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Income and spending, last six months">${g}</svg>`;
}

function upcoming(days) {

}

      <label>Amount (lowest)<input name="amount" type="number" step="0.01" min="0.01" inputmode="decimal" required></label>
      <label>Highest (optional)<input name="amountMax" type="number" step="0.01" min="0.01" inputmode="decimal" placeholder="Same as lowest"></label>
      <label>Category<select name="cat">${catOpts()}</select></label>
      <label>Repeats<select name="freq"><option value="monthly">Monthly</option><option value="weekly">Weekly</option><option value="biweekly">Every 2 weeks</option><option value="yearly">Yearly</option></select></label>
      <label>Payment<select name="auto"><option value="manual">Manual, I mark it paid</option><option value="auto">Automatic, log on due date</option></select><span style="font-weight:400">Payments with a range are always manual, so you enter the real amount.</span></label>
      <label>First date<input name="start" type="date" value="${today}" required></label>
      <label>Ends (optional)<input name="end" type="date"></label>
      <button class="btn primary" type="submit">Add</button>
    </form></div></div>`;
}
const TABS = [['overview', 'Overview'], ['activity', 'Activity'], ['budgets', 'Budgets'], ['calendar', 'Calendar'], ['goals', 'Goals'], ['split', 'Split']];
function render() {
  const showMonth = ['overview', 'activity', 'budgets'].includes(ui.tab);
  const view = { overview: vOverview, activity: vActivity, budgets: vBudgets, calendar: vCalendar, goals: vGoals, split: vSplit }[ui.tab]();
  app.innerHTML = `
    <div class="top"><div class="brand"><h1>Pocket Ledger</h1><span class="small muted">Private, stored on this device</span></div>
      <div class="monthnav">${showMonth ? monthNav(ui.month, 'm') : ''}<button class="btn sm" data-act="cfg">Settings</button></div></div>
    <nav>${TABS.map(([k, l]) => `<button data-act="tab" data-tab="${k}" ${ui.tab === k ? 'aria-current="true"' : ''}>${l}</button>`).join('')}</nav>
    ${S.sample ? `<div class="banner"><span>You are looking at sample data.</span><button class="btn sm" data-act="fresh">Start fresh</button></div>` : ''}
    ${ui.settings ? vSettings() : ''}
    ${view}
    ${ui.catModal ? catModal() : ''}
    ${ui.recModal === 'add' ? recModal() : ui.recModal === 'list' ? recListModal() : ''}`;
  if (ui.recModal) { const i = app.querySelector('.modal input'); if (i) i.focus(); }
}

/* ---------- events ---------- */
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, d = b.dataset;
  if (a !== 'del-cat') ui.delCat = null;
  if ((a === 'rec-close' || a === 'cat-close') && b.classList.contains('overlay') && e.target !== b) return;
  if (a === 'cat-open') ui.catModal = true;
  else if (a === 'cat-close') ui.catModal = false;
  else if (a === 'add-preset') { ensureColors(); if (!S.cats.includes(d.c)) { S.cats.push(d.c); S.catColors[d.c] = PAL[(S.cats.length - 1) % PAL.length]; } }
  else
  if (a === 'rec-open') ui.recModal = 'add';
  else if (a === 'rec-list') ui.recModal = 'list';
  else if (a === 'rec-close') ui.recModal = false;
  else if (a === 'tab') { ui.tab = d.tab; window.scrollTo(0, 0); }
  else if (a === 'mprev') ui.month = addMonth(ui.month, -1);
  else if (a === 'mnext') ui.month = addMonth(ui.month, 1);
  else if (a === 'cprev') ui.cal = addMonth(ui.cal, -1);
  else if (a === 'cnext') ui.cal = addMonth(ui.cal, 1);
  else if (a === 'day') ui.day = d.d;
  else if (a === 'cfg') { ui.settings = !ui.settings; ui.confirmReset = false; ui.msg = ''; }
  else if (a === 'paid') { const r = S.recurring.find(x => x.id === d.rec); const inp = b.parentElement.querySelector('input'); const amt = inp ? parseFloat(inp.value) : r && r.amount; if (!(amt > 0)) return; if (r && !isPaid(r.id, d.d)) S.txns.push({ id: uid(), type: r.type, amount: amt, cat: r.cat, date: d.d, note: r.name, recId: r.id }); }
  else if (a === 'del-cat') {
    const c = d.c;
    if (S.cats.length < 2 && c === 'Other') return;
    if (ui.delCat !== c) { ui.delCat = c; render(); return; }
    ensureColors(); ui.delCat = null;
    let to = 'Other';
    if (c === 'Other') to = S.cats.find(x => x !== c);
    else if (!S.cats.includes('Other')) { S.cats.push('Other'); S.catColors.Other = PAL[8]; }
    S.txns.forEach(x => { if (x.type === 'expense' && x.cat === c) x.cat = to; });
    S.recurring.forEach(r => { if (r.type === 'expense' && r.cat === c) r.cat = to; });
    S.cats = S.cats.filter(x => x !== c); delete S.budgets[c]; delete S.catColors[c];
  }
  else if (a === 'del-tx') S.txns = S.txns.filter(t => t.id !== d.id);
  else if (a === 'del-rec') S.recurring = S.recurring.filter(r => r.id !== d.id);
  else if (a === 'del-goal') S.goals = S.goals.filter(g => g.id !== d.id);
  else if (a === 'del-split') S.splits = S.splits.filter(x => x.id !== d.id);
  else if (a === 'del-person') S.people = S.people.filter(p => p.id !== d.id);
  else if (a === 'settle') S.splits.push({ id: uid(), kind: 'pay', from: d.from, to: d.to, amount: +d.amt, date: today });
  else if (a === 'fresh') S = blank();
  else if (a === 'reset') { if (!ui.confirmReset) { ui.confirmReset = true; render(); return; } S = blank(); ui.confirmReset = false; ui.settings = false; }
  else if (a === 'copy') {
    const t = document.getElementById('exp'), note = m => { const c = document.getElementById('copied'); if (c) c.textContent = m; };
    const fallback = () => { t.select(); note('Selected. Press Cmd+C to copy.'); };
    try { navigator.clipboard.writeText(t.value).then(() => note('Copied.'), fallback); } catch (err) { fallback(); }
    return;
  }
  commit();
});

app.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, fd = new FormData(f), kind = f.dataset.form, v = n => (fd.get(n) || '').toString().trim();
  if (kind === 'tx') {
    const [t, cat] = [v('cat')[0], v('cat').slice(2)];
    S.txns.push({ id: uid(), type: t === 'i' ? 'income' : 'expense', amount: +v('amount'), cat, date: v('date'), note: v('note') });
    ui.month = v('date').slice(0, 7);
  } else if (kind === 'cat') { const n = v('name'); if (n && !S.cats.includes(n)) { ensureColors(); S.cats.push(n); S.catColors[n] = PAL[(S.cats.length - 1) % PAL.length]; } }
  else if (kind === 'rec') {
    const c = v('cat');
    ui.recModal = 'list';
    S.recurring.push({ id: uid(), name: v('name'), amount: +v('amount'), type: c[0] === 'i' ? 'income' : 'expense', cat: c.slice(2), freq: v('freq'), start: v('start'), end: v('end') || undefined, auto: v('auto') === 'auto' && !(+v('amountMax') > +v('amount')), amountMax: +v('amountMax') > +v('amount') ? +v('amountMax') : undefined });
  } else if (kind === 'goal') S.goals.push({ id: uid(), name: v('name'), target: +v('target'), saved: +v('saved') || 0, deadline: v('deadline') || undefined });
  else if (kind === 'contrib') { const g = S.goals.find(x => x.id === f.dataset.id); if (g) g.saved = Math.max(0, round2(g.saved + +v('amount'))); }
  else if (kind === 'person') S.people.push({ id: 'p_' + uid(), name: v('name') });
  else if (kind === 'split') {
    const w = fd.getAll('with'); if (!w.length) return;
    S.splits.push({ id: uid(), kind: 'exp', desc: v('desc'), amount: +v('amount'), date: v('date'), payer: v('payer'), with: w });
  } else if (kind === 'import') {
    try {
      const o = JSON.parse(v('json'));
      if (!o || !Array.isArray(o.txns) || !Array.isArray(o.cats)) throw 0;
      S = Object.assign(blank(), o, { sample: false }); ui.msg = ''; ui.settings = false;
    } catch (err) { ui.msg = 'That does not look like a Pocket Ledger backup.'; }
  }
  commit();
});

app.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.catcolor !== undefined) { ensureColors(); S.catColors[t.dataset.catcolor] = t.value; commit(); }
  else if (t.dataset.catname !== undefined) {
    const old = t.dataset.catname, nn = t.value.trim();
    if (nn && nn !== old && !S.cats.includes(nn) && !S.incCats.includes(nn)) {
      ensureColors(); const i = S.cats.indexOf(old);
      S.cats[i] = nn; S.catColors[nn] = S.catColors[old]; delete S.catColors[old];
      if (old in S.budgets) { S.budgets[nn] = S.budgets[old]; delete S.budgets[old]; }
      S.txns.forEach(x => { if (x.type === 'expense' && x.cat === old) x.cat = nn; });
      S.recurring.forEach(r => { if (r.type === 'expense' && r.cat === old) r.cat = nn; });
    }
    commit();
  }
  else if (t.dataset.budget !== undefined) { const n = parseFloat(t.value); if (n > 0) S.budgets[t.dataset.budget] = n; else delete S.budgets[t.dataset.budget]; commit(); }
  else if (t.dataset.cur !== undefined) { S.currency = t.value; commit(); }
});

document.addEventListener('keydown', e => { if (e.key === 'Escape' && (ui.recModal || ui.catModal)) { ui.recModal = false; ui.catModal = false; render(); } });
ensureColors(); autoPost(); Store.save(S);
render();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
</script>

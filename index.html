<script>
(() => {
'use strict';

/* ---------- storage (swap this adapter for Firebase/etc. when sync is needed) ---------- */
const Store = {
  key: 'pocket-ledger-v1',
  load() { try { const r = localStorage.getItem(this.key); if (r) return JSON.parse(r); } catch (e) {} return null; },
  save(s) { try { localStorage.setItem(this.key, JSON.stringify(s)); } catch (e) {} }
};

/* ---------- helpers ---------- */
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = iso(new Date());
const thisMonth = today.slice(0, 7);
const addMonth = (k, n) => { const [y, m] = k.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const monthLabel = k => { const [y, m] = k.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' }); };
const shortMonth = k => { const [y, m] = k.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString(undefined, { month: 'short' }); };
const dayLabel = s => parse(s).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
const lastDay = k => { const [y, m] = k.split('-').map(Number); return `${k}-${pad(new Date(y, m, 0).getDate())}`; };
const round2 = n => Math.round(n * 100) / 100;

const INC_PRESETS = ['Salary', 'Side income', 'Freelance', 'Gifts', 'Interest', 'Refunds', 'Other income'];
const PRESETS = ['Groceries', 'Rent', 'Transport', 'Eating out', 'Fun', 'Bills', 'Shopping', 'Health', 'Subscriptions', 'Travel', 'Education', 'Gifts', 'Savings', 'Other'];
const PAL = ['#0E7C66', '#E07A3F', '#5B7FD6', '#C9A227', '#B455A0', '#3AA6B9', '#7A8B3C', '#D1495B', '#7C6F64'];

/* ---------- recurring occurrences ---------- */
const WD = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'], MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function occCustom(r, fromIso, toIso) {
  const out = [], s = parse(r.start), from = parse(fromIso), to = parse(toIso), end = r.end ? parse(r.end) : null, n = Math.max(1, +r.every || 1);
  const ok = d => d >= s && d >= from && d <= to && (!end || d <= end);
  if (r.unit === 'day') {
    const d = new Date(s);
    if (d < from) { const days = Math.round((from - d) / 86400000); d.setDate(d.getDate() + Math.ceil(days / n) * n); }
    for (; d <= to; d.setDate(d.getDate() + n)) { if (end && d > end) break; out.push(iso(d)); }
  } else if (r.unit === 'week') {
    const wds = (r.weekdays && r.weekdays.length ? r.weekdays : [(s.getDay() + 6) % 7]).slice().sort((a, b) => a - b);
    const ws = new Date(s); ws.setDate(s.getDate() - ((s.getDay() + 6) % 7));
    for (let w = 0; w < 6000; w++) {
      const base = new Date(ws); base.setDate(ws.getDate() + w * 7 * n); if (base > to) break;
      wds.forEach(i => { const d = new Date(base); d.setDate(base.getDate() + i); if (ok(d)) out.push(iso(d)); });
    }
  } else if (r.unit === 'month') {
    const days = [...new Set(r.monthDays && r.monthDays.length ? r.monthDays : [s.getDate()])].sort((a, b) => a - b);
    for (let i = 0; i < 1500; i++) {
      const y = s.getFullYear(), m = s.getMonth() + i * n; if (new Date(y, m, 1) > to) break;
      const dim = new Date(y, m + 1, 0).getDate(), seen = new Set();
      days.forEach(dd => { const d = new Date(y, m, Math.min(dd, dim)), k = iso(d); if (!seen.has(k) && ok(d)) { seen.add(k); out.push(k); } });
    }
  } else {
    const mos = (r.months && r.months.length ? r.months : [s.getMonth()]).slice().sort((a, b) => a - b);
    for (let i = 0; i < 300; i++) {
      const y = s.getFullYear() + i * n; if (new Date(y, 0, 1) > to) break;
      mos.forEach(mo => { const dim = new Date(y, mo + 1, 0).getDate(), d = new Date(y, mo, Math.min(s.getDate(), dim)); if (ok(d)) out.push(iso(d)); });
    }
  }
  return out;
}
function freqLabel(r) {
  if (r.freq === 'once') return 'once';

      S = Object.assign(blank(), o, { sample: false }); ui.msg = ''; ui.settings = false; ui.sub = null;
    } catch (err) { ui.msg = 'That does not look like a Pocket Ledger backup.'; }
  }
  commit();
});

app.addEventListener('input', e => {
  if (e.target.dataset.q !== undefined) { ui.q = e.target.value; const L = actList(), tt = document.getElementById('acttitle'), ll = document.getElementById('actlist'); if (tt) tt.textContent = L.title; if (ll) ll.innerHTML = L.html; return; }
  const rf = e.target.dataset.rf;
  if (rf && ui.rec) { ui.rec[rf] = e.target.type === 'checkbox' ? e.target.checked : e.target.value; ui.rec.err = ''; }
  const f = e.target.dataset.cf;
  if (f && ui.cat) { ui.cat[f] = e.target.value; ui.cat.err = ''; }
});
const tgt = () => (ui.catModal ? ui.cat : ui.rec);
const tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true; document.body.appendChild(tip);
let tipTimer = 0;
function tipShow(el, e) {
  tip.textContent = el.dataset.tip; tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 12, y = e.clientY - h - 12;
  if (e.pointerType === 'touch') { x = e.clientX - w / 2; y = e.clientY - h - 24; }
  x = Math.max(8, Math.min(x, window.innerWidth - w - 8)); if (y < 8) y = e.clientY + 18;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
document.addEventListener('pointerover', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el && e.pointerType !== 'touch') tipShow(el, e); });
document.addEventListener('pointermove', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el && e.pointerType !== 'touch') tipShow(el, e); else if (!el && e.pointerType !== 'touch') tip.hidden = true; });
document.addEventListener('pointerout', e => { if (e.pointerType !== 'touch' && e.target.closest && e.target.closest('[data-tip]')) tip.hidden = true; });
document.addEventListener('pointerdown', e => {
  const el = e.target.closest && e.target.closest('[data-tip]'); clearTimeout(tipTimer);
  if (el && e.pointerType === 'touch') { tipShow(el, e); tipTimer = setTimeout(() => { tip.hidden = true; }, 2500); } else tip.hidden = true;
});
const pk = { el: null };
function pkPaint() {
  const c = tgt(), sv = app.querySelector('[data-pk=sv]'), lb = app.querySelector('[data-pk=l]'); if (!sv || !lb) return;
  const k1 = sv.querySelector('.knob'), k2 = lb.querySelector('.knob');
  k1.style.left = c.h / 360 * 100 + '%'; k1.style.top = 100 - c.s + '%'; k2.style.top = 100 - c.l + '%';
  lb.style.background = lbarBg(c);
  const pv = document.getElementById('pk-prev'); if (pv) { pv.style.display = ''; pv.style.background = c.color; pv.classList.add('on'); }
  app.querySelectorAll('.cs[data-col]').forEach(b => b.classList.remove('on'));
}
function pkMove(e) {
  const r = pk.el.getBoundingClientRect(), x = clamp01((e.clientX - r.left) / r.width), y = clamp01((e.clientY - r.top) / r.height), c = tgt();
  if (pk.el.dataset.pk === 'sv') { c.h = Math.round(x * 360); c.s = Math.round((1 - y) * 100); } else c.l = Math.round((1 - y) * 100);
  c.color = hslHex(c.h, c.s, c.l); pkPaint();
}
app.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-pk]'); if (!el) return;
  pk.el = el; try { el.setPointerCapture(e.pointerId); } catch (err) {} pkMove(e); e.preventDefault();
});
app.addEventListener('pointermove', e => { if (pk.el) pkMove(e); });
['pointerup', 'pointercancel'].forEach(t => app.addEventListener(t, () => { pk.el = null; }));

/* ---------- bottom bar: sliding indicator + drag ---------- */
let navPrev = null;
function placeInd() {
  const nav = app.querySelector('nav'), ind = nav && nav.querySelector('.ind'), cur = nav && nav.querySelector('[aria-current]'); if (!ind || !cur) return;
  const x = cur.offsetLeft, w = cur.offsetWidth;
  const from = navPrev && navPrev.w ? navPrev : { x, w };
  ind.style.transition = 'none'; ind.style.width = from.w + 'px'; ind.style.transform = `translateX(${from.x}px)`; void ind.offsetWidth; ind.style.transition = '';
  ind.style.width = w + 'px'; ind.style.transform = `translateX(${x}px)`;
  navPrev = { x, w };
}
window.addEventListener('resize', () => { navPrev = null; placeInd(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { navPrev = null; placeInd(); });
const nd = { on: false, drag: false, just: false };
app.addEventListener('pointerdown', e => {
  const nav = e.target.closest && e.target.closest('nav'); if (!nav || (e.pointerType === 'mouse' && e.button !== 0)) return;
  const cur = nav.querySelector('[aria-current]'); if (!cur) return;
  Object.assign(nd, { on: true, drag: false, nav, ind: nav.querySelector('.ind'), cur, sx: e.clientX, ox: cur.offsetLeft, w: cur.offsetWidth, x: cur.offsetLeft, hov: cur, pid: e.pointerId });
});
app.addEventListener('pointermove', e => {
  if (!nd.on) return;
  const dx = e.clientX - nd.sx;
  if (!nd.drag) { if (Math.abs(dx) < 6) return; nd.drag = true; nd.nav.classList.add('drag'); try { nd.nav.setPointerCapture(nd.pid); } catch (err) {} }
  const bs = [...nd.nav.querySelectorAll('button')], lo = bs[0].offsetLeft, hi = bs[bs.length - 1].offsetLeft + bs[bs.length - 1].offsetWidth - nd.w;
  nd.x = Math.min(hi, Math.max(lo, nd.ox + dx));
  nd.ind.style.transform = `translateX(${nd.x}px) scale(1.07)`;
  const mid = nd.x + nd.w / 2, h = bs.find(b => mid >= b.offsetLeft && mid < b.offsetLeft + b.offsetWidth) || nd.hov;
  if (h !== nd.hov) { nd.hov = h; bs.forEach(b => b.classList.toggle('hov', b === h)); } else if (!h.classList.contains('hov')) h.classList.add('hov');
});
['pointerup', 'pointercancel'].forEach(t => app.addEventListener(t, () => {
  if (!nd.on) return; nd.on = false;
  if (!nd.drag) return;
  nd.just = true; setTimeout(() => { nd.just = false; }, 120);
  const nav = nd.nav, tab = nd.hov.dataset.tab, w = nd.hov.offsetWidth;
  nav.classList.remove('drag'); nav.querySelectorAll('button').forEach(b => b.classList.remove('hov'));
  navPrev = { x: nd.x, w: nd.w };
  if (tab !== ui.tab) { ui.tab = tab; window.scrollTo(0, 0); render(); }
  else { navPrev = { x: nd.hov.offsetLeft, w }; nd.ind.style.transform = `translateX(${nd.hov.offsetLeft}px)`; }
}));

function renameCat(old, nn) {
  ensureColors();
  const inc = S.incCats.includes(old), list = inc ? S.incCats : S.cats, ty = inc ? 'income' : 'expense';
  list[list.indexOf(old)] = nn;
  S.catColors[nn] = S.catColors[old]; delete S.catColors[old];
  if (old in S.budgets) { S.budgets[nn] = S.budgets[old]; delete S.budgets[old]; }
  if (S.catNotes && old in S.catNotes) { S.catNotes[nn] = S.catNotes[old]; delete S.catNotes[old]; }
  S.txns.forEach(x => { if (x.type === ty && x.cat === old) x.cat = nn; });
  S.recurring.forEach(r => { if (r.type === ty && r.cat === old) r.cat = nn; });
}
app.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.rf === 'varies' && ui.rec && t.checked) ui.rec.auto = 'manual';
  if (t.dataset.rf && ['freq', 'unit', 'varies', 'auto'].includes(t.dataset.rf)) render();
  else if (t.dataset.cur !== undefined) { S.currency = t.value; commit(); }
  else if (t.dataset.themeSel !== undefined) { S.theme = t.value; commit(); }
});

document.addEventListener('keydown', e => { if (e.key === 'Escape' && (ui.recModal || ui.catModal || ui.scope)) { if (ui.scope) ui.scope = null; else { ui.recModal = false; ui.catModal = false; } render(); } });
ensureColors(); autoPost(); Store.save(S);
render();
})();

<style>
/* Liquid glass: translucent blurred panels with a specular top edge over soft colour fields. */
:root{

  --glass:rgba(255,255,255,.52); --glass-strong:rgba(255,255,255,.74); --glass-edge:rgba(255,255,255,.85);

  --accent:#0A7F69; --accent-ink:#FFFFFF; --accent-soft:rgba(14,160,130,.18);
  --pos:#18794E; --neg:#D1323A; --warn:#A16207; --sav:#3F63C4; --gold:#B7860F; --gold-soft:rgba(228,176,48,.16);
  --blob1:rgba(60,200,170,.50); --blob2:rgba(110,130,255,.42); --blob3:rgba(255,170,120,.38);
  --f-display:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}

  --bg:#0A1014; --ink:#E8F1ED; --muted:#9BAEA6;
  --glass:rgba(34,46,56,.46); --glass-strong:rgba(46,60,72,.7); --glass-edge:rgba(255,255,255,.2);
  --surface2:rgba(150,165,180,.16); --line:rgba(160,175,190,.2); --field:rgba(255,255,255,.07); --shadow:0 10px 34px rgba(0,0,0,.45);
  --accent:#4BD6AA; --accent-ink:#06231A; --accent-soft:rgba(75,214,170,.2); --pos:#4ADE9A; --neg:#FF6B6B; --warn:#F5C451; --sav:#8FA9F5; --gold:#F2C14E; --gold-soft:rgba(242,193,78,.14);
  --blob1:rgba(20,140,120,.45); --blob2:rgba(70,80,200,.38); --blob3:rgba(190,100,60,.28); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1014; --ink:#E8F1ED; --muted:#9BAEA6;
  --glass:rgba(34,46,56,.46); --glass-strong:rgba(46,60,72,.7); --glass-edge:rgba(255,255,255,.2);
  --surface2:rgba(150,165,180,.16); --line:rgba(160,175,190,.2); --field:rgba(255,255,255,.07); --shadow:0 10px 34px rgba(0,0,0,.45);
  --accent:#4BD6AA; --accent-ink:#06231A; --accent-soft:rgba(75,214,170,.2); --pos:#4ADE9A; --neg:#FF6B6B; --warn:#F5C451; --sav:#8FA9F5; --gold:#F2C14E; --gold-soft:rgba(242,193,78,.14);

button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  box-shadow:inset 0 1px 0 var(--glass-edge),inset 0 0 0 1px var(--line),var(--shadow);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

.navrow button svg,.pgrid button svg{display:block;flex:none}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}
nav,nav button{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}

.navrow .ind{position:absolute;top:0;bottom:0;left:0;width:0;border-radius:999px;background:var(--glass-strong);box-shadow:inset 0 1px 0 var(--glass-edge),inset 0 0 0 1px var(--line),0 2px 10px rgba(30,50,70,.14);
  transition:transform .6s cubic-bezier(.3,1.25,.5,1),width .6s cubic-bezier(.3,1.25,.5,1);pointer-events:none}

.navmore{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .45s cubic-bezier(.3,1.15,.5,1),opacity .3s ease}
.navmore.open{grid-template-rows:1fr;opacity:1}

.linkbtn{background:none;border:0;font:inherit;font-size:13px;font-weight:600;color:var(--accent);padding:6px 8px;cursor:pointer;border-radius:8px}
.pgrid{display:flex;gap:2px;padding-bottom:6px}
.pgrid button{flex:0 0 calc((100% - 8px)/5)}
.navrow .dots3{display:block}
.navrow button.opened .dots3{transform:rotate(90deg)}
.dots3{transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
@media(min-width:720px){
  body{padding-block:24px 48px}
  nav{position:sticky;top:12px;bottom:auto;left:auto;right:auto;align-self:center;max-width:100%;flex-direction:column-reverse}
  .navrow button,.pgrid button{flex:none;font-size:12px;min-width:84px;padding:9px 12px 8px}
  .pgrid button{flex:none}
}
.card,.tile,.banner{background:var(--glass);box-shadow:inset 0 1px 0 var(--glass-edge),inset 0 0 0 1px var(--line),var(--shadow)}

.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}

}
function donut(entries, total, label) {
  const hasSav = entries.some(e => e[2]);
  const r = 46, c = 2 * Math.PI * r; let off = 0;
  const segs = entries.map(([name, v, col]) => {
    const len = (v / total) * c;
    const s = `<circle class="seg" data-tip="${esc(name)} · ${esc(fmt0(v))} (${Math.round(v / total * 100)}%)" cx="60" cy="60" r="${r}" fill="none" stroke="${col || catColor(name)}" style="stroke:${col || catColor(name)}" stroke-width="16" stroke-dasharray="${len} ${c - len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;
    off += len; return s;
  }).join('');
  return `<svg viewBox="0 0 120 120" width="150" height="150" role="img" aria-label="${label ? 'Income by category' : 'Spending by category'}">
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="16"/>${total ? segs : ''}
    <text x="60" y="58" text-anchor="middle" class="t" style="font-size:9px">${label || (hasSav ? 'Spent &amp; saved' : 'Spent')}</text>
    <text x="60" y="73" text-anchor="middle" style="font-size:13px;font-weight:700;fill:var(--ink)">${esc(fmt0(total))}</text></svg>`;
}
function bars() {
  const keys = []; for (let i = 5; i >= 0; i--) keys.push(addMonth(ui.month, -i));
  const data = keys.map(totals), max = Math.max(1, ...data.flatMap(d => [d.inc, d.exp]));
  const W = 360, H = 170, pl = 38, pb = 22, pt = 10, pr = 4, ih = H - pb - pt, gw = (W - pl - pr) / 6, bw = Math.min(16, gw / 2 - 4);
  const y = v => pt + ih - (v / max) * ih, cf = new Intl.NumberFormat(undefined, { notation: 'compact', maximumFractionDigits: 1 });
  let g = '';
  [0, .5, 1].forEach(f => { g += `<line class="g" x1="${pl}" x2="${W - pr}" y1="${y(max * f)}" y2="${y(max * f)}"/><text class="t" x="${pl - 4}" y="${y(max * f) + 3}" text-anchor="end">${cf.format(max * f)}</text>`; });
  data.forEach((d, i) => {
    const x0 = pl + i * gw + gw / 2;
    g += `<rect class="c-inc" x="${x0 - bw - 1}" y="${y(d.inc)}" width="${bw}" height="${ih - (y(d.inc) - pt)}" rx="2"/>`;
    g += `<rect class="c-exp" x="${x0 + 1}" y="${y(d.exp)}" width="${bw}" height="${ih - (y(d.exp) - pt)}" rx="2"/>`;
    g += `<rect fill="rgba(0,0,0,0)" x="${x0 - bw - 1}" y="${pt}" width="${bw}" height="${ih}" data-tip="${esc(shortMonth(keys[i]))} · Income ${esc(fmt(d.inc))}"/><rect fill="rgba(0,0,0,0)" x="${x0 + 1}" y="${pt}" width="${bw}" height="${ih}" data-tip="${esc(shortMonth(keys[i]))} · Spent ${esc(fmt(d.exp))}"/>`;
    g += `<text class="t" x="${x0}" y="${H - 6}" text-anchor="middle">${esc(shortMonth(keys[i]))}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Income and spending, last six months">${g}</svg>`;
}

}
